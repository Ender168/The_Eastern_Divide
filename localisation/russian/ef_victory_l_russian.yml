 ef_victory_desc:0 "§GСтандартная победа§!: порог снижается каждые §Y105 дней§!, удержание — §Y150 дней§!.\n§CБыстрая победа§!: порог снижается каждые §Y225 дней§!, удержание — §Y60 дней§!.\nОба режима начинают с §Y25§! городов противника, минимум — §Y1§!.\n[ROOT.GetEfVictoryScore]"
 ef_victory_score_initial:0 "Исходный контроль: Запад §Y25/50§!, Восток §Y25/50§!. Обе стороны захватили §Y0/25§! городов противника. Стартовое требование — §Y25§! вражеских городов."
 ef_victory_score_sampled:0 "Запад: §Y[?global.ef_wef_enemy_vp|0]/25§!, Восток: §Y[?global.ef_eef_enemy_vp|0]/25§!. Порог: стандарт §Y[?global.ef_enemy_vp_threshold|0]§!, быстрый §Y[?global.ef_fast_threshold|0]§!."
 ef_victory_rule_standard_tt:0 "Начальное требование — §Y25 ключевых городов противника§!. Оно снижается на один каждые §Y105 дней§! начатого матча, до одного. При достижении текущего порога запускается миссия на §Y150 дней§!. Контроль нужно сохранять на ежемесячных проверках и при истечении миссии."
 ef_victory_rule_fast_tt:0 "Начальное требование — §Y25 ключевых городов противника§!. Оно снижается на один каждые §Y225 дней§! начатого матча, до одного. При достижении текущего порога запускается миссия на §Y60 дней§!. Контроль нужно сохранять на ежемесячных проверках и при истечении миссии."

